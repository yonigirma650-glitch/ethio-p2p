<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio P2P</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #121418;
      color: #EAECEF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .bg-card { background-color: #1E232A; }
    .text-yellow-custom { color: #F0B90B; }
    .bg-yellow-custom { background-color: #F0B90B; }
    .border-custom { border-color: #2B313A; }
  </style>
</head>
<body class="pb-20">

  <!-- Header Section -->
  <header class="p-4 border-b border-custom flex justify-between items-center bg-[#181A20] sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <span class="text-xl">🇪🇹</span>
      <h1 class="text-lg font-bold text-white">Ethio P2P</h1>
    </div>
    <span class="text-xs bg-gray-800 text-yellow-custom px-2 py-1 rounded font-semibold">USDT / ETB</span>
  </header>

  <!-- Main Content Container -->
  <main class="p-4">
    
    <!-- Buy / Sell Toggle Buttons -->
    <div class="flex bg-[#181A20] p-1 rounded-xl mb-4 border border-custom">
      <button id="buyTabBtn" onclick="switchTab('buy')" class="flex-1 py-2 rounded-lg bg-emerald-600 font-bold text-white text-sm transition">Biti (Buy)</button>
      <button id="sellTabBtn" onclick="switchTab('sell')" class="flex-1 py-2 rounded-lg text-gray-400 font-bold text-sm hover:text-white transition">Gurguri (Sell)</button>
    </div>

    <!-- P2P Listings Container -->
    <div id="listings" class="space-y-3">
      
      <!-- P2P Ad Item 1 -->
      <div class="bg-card p-4 rounded-xl border border-custom space-y-3">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-amber-500 text-black text-xs font-bold flex items-center justify-center">T</span>
            <div>
              <p class="font-bold text-sm text-white flex items-center gap-1">Teke_94 <i class="fa-solid fa-circle-check text-yellow-custom text-[10px]"></i></p>
              <p class="text-[11px] text-gray-400">602 ajajoota | 99.0% xumureera</p>
            </div>
          </div>
          <button class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-4 py-1.5 rounded-lg text-sm">Biti</button>
        </div>
        
        <div class="flex justify-between items-end border-t border-custom pt-2">
          <div>
            <p class="text-[11px] text-gray-400">Gatii (Price)</p>
            <p class="text-lg font-bold text-white">194.00 <span class="text-xs font-normal text-yellow-custom">ETB</span></p>
          </div>
          <div class="text-right">
            <p class="text-[11px] text-gray-400">Daangaa: 300.00 - 795.40 ETB</p>
            <div class="flex gap-1 justify-end mt-1">
              <span class="bg-[#181A20] border border-custom text-gray-300 px-2 py-0.5 rounded text-[10px]">Telebirr</span>
              <span class="bg-[#181A20] border border-custom text-gray-300 px-2 py-0.5 rounded text-[10px]">CBE Birr</span>
            </div>
          </div>
        </div>
      </div>

      <!-- P2P Ad Item 2 -->
      <div class="bg-card p-4 rounded-xl border border-custom space-y-3">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-blue-500 text-white text-xs font-bold flex items-center justify-center">A</span>
            <div>
              <p class="font-bold text-sm text-white flex items-center gap-1">AA_HH <i class="fa-solid fa-circle-check text-yellow-custom text-[10px]"></i></p>
              <p class="text-[11px] text-gray-400">146 ajajoota | 100% xumureera</p>
            </div>
          </div>
          <button class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-4 py-1.5 rounded-lg text-sm">Biti</button>
        </div>
        
        <div class="flex justify-between items-end border-t border-custom pt-2">
          <div>
            <p class="text-[11px] text-gray-400">Gatii (Price)</p>
            <p class="text-lg font-bold text-white">194.40 <span class="text-xs font-normal text-yellow-custom">ETB</span></p>
          </div>
          <div class="text-right">
            <p class="text-[11px] text-gray-400">Daangaa: 200.00 - 8,845.00 ETB</p>
            <div class="flex gap-1 justify-end mt-1">
              <span class="bg-[#181A20] border border-custom text-gray-300 px-2 py-0.5 rounded text-[10px]">Telebirr</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bottom Navigation Menu Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#181A20] border-t border-custom py-2 px-4 flex justify-between items-center text-center text-xs text-gray-400 z-50">
    <button class="flex flex-col items-center gap-1 text-yellow-custom">
      <i class="fa-solid fa-house text-lg"></i>
      <span>Fuula Duraa</span>
    </button>
    <button class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-file-invoice text-lg"></i>
      <span>Ajaja</span>
    </button>
    <button class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-bullhorn text-lg"></i>
      <span>Beeksisa</span>
    </button>
    <button class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-wallet text-lg"></i>
      <span>Kaffaltii</span>
    </button>
    <button class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-ellipsis text-lg"></i>
      <span>Dabalata</span>
    </button>
  </nav>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Tab Switcher Function
    function switchTab(type) {
      const buyBtn = document.getElementById('buyTabBtn');
      const sellBtn = document.getElementById('sellTabBtn');
      
      if(type === 'buy') {
        buyBtn.className = "flex-1 py-2 rounded-lg bg-emerald-600 font-bold text-white text-sm transition";
        sellBtn.className = "flex-1 py-2 rounded-lg text-gray-400 font-bold text-sm hover:text-white transition";
      } else {
        sellBtn.className = "flex-1 py-2 rounded-lg bg-rose-600 font-bold text-white text-sm transition";
        buyBtn.className = "flex-1 py-2 rounded-lg text-gray-400 font-bold text-sm hover:text-white transition";
      }
    }
  </script>
</body>
</html>
