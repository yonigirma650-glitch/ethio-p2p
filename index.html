<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
background:#06131f;
color:white;
font-family:Arial;
margin:0;
}

.page{
display:none;
padding:20px;
}

.page.show{
display:block;
}

.card{
background:#10263a;
padding:15px;
border-radius:15px;
margin:15px 0;
}

button{
background:#18d995;
border:0;
padding:12px;
border-radius:10px;
color:white;
font-size:16px;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#102033;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav button{
background:none;
font-size:14px;
}

</style>
</head>

<body>

<div id="home" class="page show">
<h2>P2P Trading</h2>

<button>Buy</button>
<button>Sell</button>

<div class="card">
<h3>Tekbirr</h3>
<p>Price: 195 ETB</p>
<p>Limit: 200 - 5000 ETB</p>
<button>Buy</button>
</div>

</div>


<div id="orders" class="page">
<h2>My Orders</h2>
<div class="card">
No ongoing orders
</div>
</div>


<div id="ads" class="page">
<h2>My Ads</h2>
<div class="card">
Create your first Ad
</div>
</div>


<div id="wallet" class="page">
<h2>Wallet</h2>
<div class="card">
Balance: $0.00 USDT
</div>
</div>


<div id="more" class="page">
<h2>Profile</h2>
<div class="card">
Username: ETHIO User<br><br>
Verification: Not Verified
</div>
</div>


<div class="nav">

<button onclick="openPage('home')">
🏠<br>Home
</button>

<button onclick="openPage('orders')">
📄<br>Orders
</button>

<button onclick="openPage('ads')">
📢<br>Ads
</button>

<button onclick="openPage('wallet')">
💰<br>Wallet
</button>

<button onclick="openPage('more')">
☰<br>More
</button>

</div>


<script>

function openPage(page){

document.querySelectorAll(".page").forEach(function(p){
p.classList.remove("show");
});

document.getElementById(page).classList.add("show");

}

</script>

</body>
  </html>
