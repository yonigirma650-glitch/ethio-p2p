<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethio P2P</title>

<style>
body{
 margin:0;
 background:#0b0b0f;
 color:white;
 font-family:Arial,sans-serif;
}
.header{
 padding:25px;
 text-align:center;
 font-size:28px;
 font-weight:bold;
 color:#f5c400;
}
.card{
 background:#181820;
 margin:15px;
 padding:20px;
 border-radius:20px;
}
.balance{
 font-size:25px;
 color:#f5c400;
}
button{
 width:100%;
 padding:15px;
 margin-top:10px;
 border:0;
 border-radius:15px;
 background:#f5c400;
 font-size:18px;
 font-weight:bold;
}
.menu{
 display:flex;
 position:fixed;
 bottom:0;
 width:100%;
 background:#15151b;
}
.menu div{
 flex:1;
 padding:15px 5px;
 text-align:center;
 font-size:13px;
 color:#ddd;
}
.active{
 color:#f5c400!important;
}
.title{
 color:#f5c400;
 font-size:20px;
}
.item{
 background:#22222b;
 padding:15px;
 margin-top:10px;
 border-radius:15px;
}
</style>

</head>

<body>

<div class="header">
🟡 Ethio P2P
</div>


<div class="card">
<h2>Welcome 👋</h2>
<p>Fast, Secure P2P Trading</p>

<div class="balance">
USDT 0.00
</div>

<button>💰 Buy USDT</button>
<button>🔄 Sell USDT</button>
</div>


<div class="card">
<div class="title">Market</div>

<div class="item">
✅ Verified Seller<br>
Price: 150 ETB<br>
Payment: Bank / Telebirr
<button>Buy Now</button>
</div>

<div class="item">
✅ Verified Buyer<br>
Price: 149 ETB<br>
Payment: Bank / Telebirr
<button>Sell Now</button>
</div>

</div>


<div class="card">
<div class="title">My Orders</div>

<div class="item">
No active orders
</div>
</div>


<div class="card">
<div class="title">My Ads</div>

<button>➕ Create Advertisement</button>
</div>


<div class="card">
<div class="title">Wallet</div>

<div class="item">
USDT Balance: 0.00<br>
ETB Balance: 0.00
</div>

<button>Deposit</button>
<button>Withdraw</button>
</div>



<div class="menu">

<div class="active">
🏠<br>Home
</div>

<div>
💰<br>Buy
</div>

<div>
🔄<br>Sell
</div>

<div>
📋<br>Orders
</div>

<div>
☰<br>Menu
</div>

</div>


</body>
</html>
